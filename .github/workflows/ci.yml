name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test, build, and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The API integration tests run against a real PostgreSQL, so the job
      # starts the service below and applies the migrations before testing.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_TELEMETRY_DISABLED: "1"

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The API lint rules are type-aware and need the generated Prisma client.
      - name: Generate Prisma client
        run: npm run db:generate --workspace=@crochet-peakz/api

      - name: Apply database migrations
        run: npm run db:deploy --workspace=@crochet-peakz/api

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      # Run the build before typecheck. Next.js generates route types such as
      # LayoutProps during the build; a clean checkout has no .next/types yet.
      - name: Build
        run: npm run build

      - name: Typecheck
        run: npm run typecheck
